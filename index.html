<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Cormorant+Garamond:wght@300;400;500&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/images/hero-portrait.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/logoLoader.png" />
    <link rel="preload" as="image" href="/images/loader-background.jpg" />
    <meta
      name="description"
      content="Photophactory — concert, portrait, and people photography captured with feeling."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik+Scribble&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <title>Photophactory — Concert &amp; Portrait Photography</title>
    <style>
      :root {
        --ink: #0a0a10;
        /* logo width; its height is width * 710 / 864 */
        --w: clamp(210px, 36vw, 400px);
      }

      body {
        margin: 0;
        /* Prevent scrolling while loading */
        overflow: hidden;
      }
      .rubik-scribble-regular {
        font-family: 'Rubik Scribble', system-ui;
        font-weight: 400;
        font-style: normal;
      }
      .tektur-regular {
        font-family: 'Tektur', sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-variation-settings: 'wdth' 100;
      }

      /* --- LOADER BACKDROP (lifts away at the end) --- */
      .load-wrapper {
        position: fixed;
        inset: 0;
        height: 100vh;
        height: 100dvh;
        background: var(--ink);
        z-index: 9999;
        overflow: hidden;
        will-change: transform;
      }

      .load-bg {
        position: absolute;
        inset: 0;
        background: url('/images/loader-background.jpg') center / cover no-repeat;
        /* opacity: 0.24; */
      }

      /* keeps the white logo readable on top of any background image */
      .load-shade {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(10, 10, 16, 0.35) 0%,
          rgba(10, 10, 16, 0.88) 100%
        );
      }

      /* --- PERSISTENT ELEMENTS (sit above the backdrop) --- */
      .load-glow {
        position: fixed;
        left: 50%;
        top: 50%;
        width: calc(var(--w) * 1.5);
        aspect-ratio: 1;
        margin: calc(var(--w) * -0.75) 0 0 calc(var(--w) * -0.75);
        opacity: 0;
        z-index: 10000;
        pointer-events: none;
        will-change: transform, opacity;
      }

      .load-glow .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(#ff3d9a, #8a5cff, #3c82ff, #33d1ff, #ffb020, #ff6e40, #ff3d9a);
        /* soft edge without blur(): much cheaper to render */
        -webkit-mask-image: radial-gradient(closest-side, #000 20%, transparent 100%);
        mask-image: radial-gradient(closest-side, #000 20%, transparent 100%);
        animation: ring-spin 16s linear infinite;
        will-change: transform;
      }

      @keyframes ring-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .load-logo {
        position: fixed;
        left: 50%;
        top: 50%;
        width: var(--w);
        aspect-ratio: 864 / 710;
        transform: translate(-50%, -50%);
        z-index: 10000;
        will-change: transform;
      }

      /* one of the six lens shapes, cut out of logoLoader.png by JS */
      .slice {
        position: absolute;
        top: 0;
        height: 100%;
        background: url('/images/logoLoader.png') no-repeat;
        opacity: 0;
        will-change: transform, opacity;
      }

      .load-logo.is-static .slice,
      /* colored light behind one slice (opacity/transform only, no filters) */
      .halo {
        position: absolute;
        top: -10%;
        height: 120%;
        transform: translateX(-50%);
        opacity: 0;
        pointer-events: none;
        will-change: transform, opacity;
      }

      .load-progress {
        position: fixed;
        left: 50%;
        top: calc(50% + var(--w) * 0.411 + 34px);
        width: min(220px, 50vw);
        transform: translateX(-50%);
        z-index: 10000;
        color: #ffffff;
      }

      .load-line {
        height: 2px;
        background: rgba(255, 61, 154, 0.25);
        overflow: hidden;
      }

      .load-fill {
        height: 100%;
        transform: scaleX(0);
        transform-origin: left center;
        background: linear-gradient(90deg, #3c82ff, #ffb020);
        will-change: transform;
      }

      .load-count {
        margin-top: 12px;
        text-align: center;
        font-family: 'Fraunces', serif;
        font-weight: 300;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
        opacity: 0.85;
      }

      .load-title {
        position: fixed;
        bottom: 28px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: 'Fraunces', serif;
        font-style: italic;
        font-weight: 300;
        font-size: 16px;
        letter-spacing: 0.04em;
        color: #ffffff;
        z-index: 10000;
        opacity: 0;
      }

      .load-title.is-on {
        opacity: 0.9;
      }

      /* --- MAIN CONTENT --- */
      .page-wrapper {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      .mainimage {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      @media (prefers-reduced-motion: reduce) {
        .load-glow .ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Colored light behind the logo -->
    <div class="load-glow"><div class="ring"></div></div>

    <!-- Persistent Global Logo (six slices are added by the script) -->
    <div class="load-logo" role="img" aria-label="Logo"></div>

    <div class="load-progress" aria-hidden="true">
      <div class="load-line"><div class="load-fill"></div></div>
      <div class="load-count">0%</div>
    </div>

    <div class="load-title">Photophactory.one</div>

    <!-- The Loader Overlay -->
    <div class="load-wrapper">
      <div class="load-bg"></div>
      <div class="load-shade"></div>
    </div>

    <!-- Your Main Page Content -->
    <div id="app"></div>

    <!--
      The loader runs on the browser's own animation engine (transform/opacity only),
      so it keeps moving smoothly even while your app is busy mounting underneath.
      It starts right away and does not wait for GSAP or the app.
    -->
    <script>
      ;(() => {
        const $ = (s) => document.querySelector(s)
        const app = $('#app')
        const wrapper = $('.load-wrapper')
        const glow = $('.load-glow')
        const logo = $('.load-logo')
        const progress = $('.load-progress')
        const fill = $('.load-fill')
        const count = $('.load-count')
        const title = $('.load-title')

        /* ---------- SETTINGS ---------- */
        const MIN_SECONDS = 0.9 // keep the intro brief; real loading still controls the reveal
        const MAX_WAIT = 5000 // ms: never hold the page indefinitely

        // light color behind each slice, left to right
        const COLORS = [
          [255, 61, 154],
          [138, 92, 255],
          [60, 130, 255],
          [51, 209, 255],
          [255, 176, 32],
          [255, 110, 64],
        ]

        // pixel columns of the six shapes inside the original 1254px logo
        const RUNS = [
          [195, 263],
          [289, 377],
          [401, 573],
          [681, 852],
          [877, 965],
          [991, 1058],
        ]
        const BX = 195 // left edge of the artwork in the original
        const BW = 864 // artwork width (logoLoader.png is cropped to this)
        const BH = 710 // artwork height
        const RANK = [0, 1, 2, 2, 1, 0] // landing order: outer shapes first

        const anims = []
        const play = (el, keyframes, opts) => {
          const a = el.animate(keyframes, { fill: 'both', ...opts })
          anims.push(a)
          return a
        }

        // hide the page while the loader is up (it is shown right before the reveal)
        app.style.visibility = 'hidden'

        let raf = 0
        const dock = () => {
          anims.forEach((a) => a.cancel())
          cancelAnimationFrame(raf)
          wrapper.style.display = 'none'
          glow.style.display = 'none'
          progress.style.display = 'none'
          logo.style.display = 'none'
          title.style.display = 'none'
          app.style.visibility = 'visible'
          document.body.style.overflow = 'auto'
        }

        try {
          /* ---------- BUILD THE SIX SLICES ---------- */
          const halos = []
          const slices = []
          RUNS.forEach(([a, b], i) => {
            const w = b - a + 1
            const [r, g, bl] = COLORS[i]

            const h = document.createElement('i')
            h.className = 'halo'
            h.style.left = (((a + b) / 2 - BX) / BW) * 100 + '%'
            h.style.width = (w / BW) * 100 + 24 + '%'
            h.style.background = `radial-gradient(closest-side, rgba(${r},${g},${bl},0.7), rgba(${r},${g},${bl},0))`
            logo.appendChild(h)
            halos.push(h)

            const s = document.createElement('span')
            s.className = 'slice'
            s.style.left = ((a - BX) / BW) * 100 + '%'
            s.style.width = (w / BW) * 100 + '%'
            s.style.backgroundSize = `${(BW / w) * 100}% 100%`
            s.style.backgroundPosition = `${((a - BX) / (BW - w)) * 100}% 0`
            logo.appendChild(s)
            slices.push(s)
          })

          /* ---------- READINESS: page, fonts, and the images you can see ---------- */
          const pageReady =
            document.readyState === 'complete'
              ? Promise.resolve()
              : new Promise((res) => window.addEventListener('load', res, { once: true }))
          const fontsReady = document.fonts ? document.fonts.ready : Promise.resolve()

          // decode the on-screen images now (off the main thread) so the reveal does not stall
          const decodeVisible = () => {
            const imgs = [...app.querySelectorAll('img')].filter((img) => {
              const r = img.getBoundingClientRect()
              return r.top < window.innerHeight * 1.2 && r.bottom > 0
            })
            return Promise.allSettled(imgs.map((img) => (img.decode ? img.decode() : null)))
          }

          const ready = Promise.race([
            Promise.all([pageReady, fontsReady]).then(decodeVisible),
            new Promise((res) => setTimeout(res, MAX_WAIT)),
          ])

          /* ---------- REDUCED MOTION: no animation, just a quick fade ---------- */
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            logo.classList.add('is-static')
            title.classList.add('is-on')
            ready.then(() => {
              const fades = [wrapper, glow, progress].map((el) =>
                el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' }),
              )
              app.style.visibility = 'visible'
              Promise.all(fades.map((f) => f.finished)).then(dock)
            })
            return
          }

          /* ---------- INTRO ---------- */
          slices.forEach((s, i) => {
            const dir = i % 2 ? 90 : -90
            play(
              s,
              [
                { opacity: 0, transform: `translateY(${dir}px) scaleY(0.7)` },
                { opacity: 1, transform: 'translateY(0) scaleY(1)' },
              ],
              {
                duration: 1000,
                delay: 200 + RANK[i] * 140,
                easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
              },
            )
            play(
              halos[i],
              [
                { opacity: 0, transform: 'translateX(-50%) scale(0.6)' },
                { opacity: 1, transform: 'translateX(-50%) scale(1)' },
              ],
              {
                duration: 1000,
                delay: 350 + RANK[i] * 140,
                easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)',
              },
            )
          })

          play(
            glow,
            [
              { opacity: 0, transform: 'scale(0.6)' },
              { opacity: 0.45, transform: 'scale(1)' },
            ],
            { duration: 1000, delay: 500, easing: 'ease-out' },
          )
          play(title, [{ opacity: 0 }, { opacity: 0.9 }], {
            duration: 1200,
            delay: 1000,
            easing: 'ease-out',
          })

          // progress bar: runs to 90% on a timer, the last 10% is earned by real loading
          const bar = play(fill, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(0.9)' }], {
            duration: MIN_SECONDS * 1000,
            delay: 100,
            easing: 'cubic-bezier(0.45, 0, 0.55, 1)',
          })
          let finishBar = null
          let shown = -1
          const tick = () => {
            const t = (a) => a.effect.getComputedTiming().progress || 0
            const p = finishBar ? 90 + t(finishBar) * 10 : t(bar) * 90
            const n = Math.round(p)
            if (n !== shown) {
              shown = n
              count.textContent = n + '%'
            }
            raf = requestAnimationFrame(tick)
          }
          raf = requestAnimationFrame(tick)

          /* ---------- OUTRO: waits for the timer AND the page ---------- */
          Promise.all([bar.finished, ready]).then(async () => {
            finishBar = play(fill, [{ transform: 'scaleX(0.9)' }, { transform: 'scaleX(1)' }], {
              duration: 350,
              easing: 'ease-out',
            })
            await finishBar.finished

            app.style.visibility = 'visible' // already decoded, safe to show under the curtain

            const out = []

            halos.forEach((h) =>
              out.push(
                play(h, [{ opacity: 1 }, { opacity: 0 }], { duration: 800, easing: 'ease-out' }),
              ),
            )
            out.push(
              play(glow, [{ opacity: 0.45 }, { opacity: 0 }], {
                duration: 800,
                easing: 'ease-out',
              }),
            )
            out.push(
              play(progress, [{ opacity: 1 }, { opacity: 0 }], {
                duration: 400,
                easing: 'ease-out',
              }),
            )

            // Clear the temporary mark as the backdrop lifts away.
            out.push(
              play(logo, [{ opacity: 1 }, { opacity: 0 }], { duration: 450, easing: 'ease-out' }),
            )
            out.push(
              play(title, [{ opacity: 0.9 }, { opacity: 0 }], {
                duration: 350,
                easing: 'ease-out',
              }),
            )
            out.push(
              play(wrapper, [{ transform: 'translateY(0)' }, { transform: 'translateY(-100%)' }], {
                duration: 800,
                delay: 100,
                easing: 'cubic-bezier(0.87, 0, 0.13, 1)',
              }),
            )

            await Promise.all(out.map((a) => a.finished))
            dock()
          })
        } catch (err) {
          // never leave the visitor stuck behind a broken loader
          console.error('Loader failed, skipping it:', err)
          dock()
        }
      })()
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
