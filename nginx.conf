server {
    listen 80;
    server_name photophactory.one www.photophactory.one; # Put your actual domain here
    root /usr/share/nginx/html;
    index index.html;

    # --- Performance & Kernel Optimizations ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    # Include webp/images if applicable, plus text/css, javascript, svg, json
    gzip_types 
        text/plain 
        text/css 
        text/javascript 
        application/javascript 
        application/json 
        image/svg+xml 
        image/webp;

    # --- Hashed build files (JS/CSS) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- Photos: unhashed filenames (Cache 30 days) ---
    location /photos/ {
        expires 30d;
        # 'always' ensures headers are sent even on non-200 responses if needed,
        # but more importantly, keeps the block clean.
        add_header Cache-Control "public, max-age=2592000, no-transform";
        try_files $uri =404;
        
        # Disable access logs for images to save disk I/O on Contabo VPS
        access_log off;
    }

    # --- Always revalidate index.html for SPA deploys ---
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # --- SPA fallback for Vue Router ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}